<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>You’re invited!</title>

  <!-- Open Graph (link previews) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Invitation Card">
  <meta property="og:title" content="Invitation Card">
  <meta property="og:url" content="https://sfezekile.github.io/Invite-Card/">
  <meta property="og:image" content="https://sfezekile.github.io/Invite-Card/images/frame 1.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Invitation Card logo">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Archivo+Black&family=Playfair+Display:wght@900&family=Anton&family=Abril+Fatface&family=Special+Elite&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --paper: #ece5d6;
      --ink: #000;
      --tile1: #d8d0be;
      --tile2: #e9e3d5;
      --tile3: #f4f0e6;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Syne, "Helvetica Neue", Arial, sans-serif;
      min-height: 100svh;
      overflow-x: hidden;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .25 0 0 0 0 .2 0 0 0 .13 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")
    }

    .stage {
      position: relative;
      max-width: 430px;
      min-height: 100svh;
      margin: 0 auto;
      padding: 28px 24px 40px
    }

    .star {
      position: absolute;
      width: var(--s);
      height: var(--s);
      transform: rotate(var(--r));
      pointer-events: none
    }

    /* gate */
    #gate {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 22px;
      min-height: 100svh
    }

    #gate h1 {
      font-family: "Archivo Black", Impact, sans-serif;
      font-size: clamp(44px, 15vw, 64px);
      line-height: .95;
      letter-spacing: -.02em
    }

    #gate p {
      font-weight: 700;
      font-size: 18px;
      min-height: 1.6em
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      min-height: 56px;
      width: 100%;
      position: relative
    }

    button,
    .btn {
      font: 800 17px Syne, sans-serif;
      border: 2.5px solid #000;
      background: #000;
      color: var(--paper);
      padding: 14px 26px;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block
    }

    button.ghost {
      background: transparent;
      color: #000;
      transition: transform .25s
    }

    button:focus-visible,
    .btn:focus-visible {
      outline: 3px solid #000;
      outline-offset: 3px
    }

    /* invite */
    #invite {
      display: none
    }

    #invite.on {
      display: block
    }

    .ransom {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;   /* centers the letters */
      gap: 2px;                  /* spacing between tiles */
      width: 100%;
      padding: 0 6px;
    }

    .ransom-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin: 34px -6px 0;
      position: relative;
      z-index: 3;
    }

    .ransom span {
      display: inline-block;
      padding: 2px 5px 0;
      font-size: 30px;
      line-height: 1.1;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .25)
    }

    .ransom .sp {
      width: 10px;
      padding: 0;
      box-shadow: none;
      background: none !important
    }

    .sub {
      text-align: center;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: .42em;
      text-transform: uppercase;
      margin-top: 12px;
      padding-left: .42em
    }

    .hero {
      position: relative;
      height: 410px;
      margin-top: 6px
    }

    .num {
      position: absolute;
      top: 34px;
      font-family: Anton, Impact, "Arial Narrow", sans-serif;
      font-size: 300px;
      line-height: 1;
      transform: scaleY(1.32);
      transform-origin: 50% 0;
      color: #000
    }

    .n1 {
      left: -4px
    }

    .n8 {
      right: -4px
    }

    .blurb {
      position: absolute;
      top: 0;
      left: 50%;
      width: 140px;
      transform: translateX(-50%);
      text-align: center;
      font-weight: 800;
      font-size: 13px;
      line-height: 1.3;
      z-index: 3
    }

    .blurb b {
      display: block;
      font-size: 17px
    }

    .hero img {
      position: absolute;
      left: 45%;
      bottom: 0;
      height: 385px;
      transform: translateX(-50%);
      filter: grayscale(1) contrast(1.1) drop-shadow(2px 0 0 #ece5d6) drop-shadow(-2px 0 0 #ece5d6);
      z-index: 2
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 22px
    }

    .col {
      border-left: 5px solid #000;
      padding-left: 12px;
      font-weight: 700;
      font-size: 16px;
      line-height: 1.3
    }

    .col b {
      display: block;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.01em
    }

    .cta {
      text-align: center;
      margin-top: 30px
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50
    }

    .rv {
      animation: rise .6s ease-out both;
      animation-delay: calc(var(--d, 0)*140ms)
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .pop {
      animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both;
      animation-delay: calc(var(--i)*90ms)
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: rotate(var(--r)) scale(.2)
      }

      to {
        opacity: 1;
        transform: rotate(var(--r)) scale(1)
      }
    }

    @media (prefers-reduced-motion:reduce) {

      .pop,
      .rv {
        animation: none
      }

      button.ghost {
        transition: none
      }
    }
  </style>
</head>

<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f6f3ec" />
        <stop offset=".45" stop-color="#b9b3a4" />
        <stop offset=".6" stop-color="#e9e5da" />
        <stop offset="1" stop-color="#8f8a7d" />
      </linearGradient>
      <symbol id="st" viewBox="0 0 100 100">
        <path d="M50 2 L62 36 L98 38 L69 60 L80 96 L50 75 L20 96 L31 60 L2 38 L38 36Z" />
      </symbol>
    </defs>
  </svg>

  <canvas id="fx" aria-hidden="true"></canvas>
  <main class="stage">
    <section id="gate">
      <h1 id="gHi"></h1>
      <p id="gMsg">you’ve got a birthday dinner invite</p>
      <div class="row" id="gRow">
        <button id="open">Open invite</button>
      </div>
    </section>

    <section id="invite" aria-label="Birthday dinner invitation">
      <svg class="star pop" style="--s:130px;--r:18deg;--i:0;top:-14px;right:-34px;fill:#000">
        <use href="#st" />
      </svg>
      <svg class="star pop" style="--s:100px;--r:-20deg;--i:1;top:300px;left:-40px;fill:#000">
        <use href="#st" />
      </svg>
      <svg class="star pop" style="--s:76px;--r:12deg;--i:2;top:22px;right:10px;fill:url(#chrome)">
        <use href="#st" />
      </svg>
      <svg class="star pop" style="--s:62px;--r:-8deg;--i:3;top:326px;left:6px;fill:url(#chrome)">
        <use href="#st" />
      </svg>
      <svg class="star pop" style="--s:90px;--r:25deg;--i:4;top:420px;right:-34px;fill:#000">
        <use href="#st" />
      </svg>

      <div class="rv ransom-wrap" style="--d:0" aria-label="Happy Birthday">
        <div class="ransom" id="ransom1"></div>
        <div class="ransom" id="ransom2"></div>
      </div>
      <p class="rv sub" style="--d:1">invitation</p>
      <div class="rv hero" style="--d:2" id="hero">
        <div class="num n1" id="n1"></div>
        <div class="num n8" id="n8"></div>
        <p class="blurb" id="blurb"></p>
      </div>
      <div class="rv info" style="--d:3">
        <div class="col" id="colL"></div>
        <div class="col" id="colR"></div>
      </div>
      <div class="rv cta" id="cta" style="--d:4"></div>
    </section>
  </main>

  <script>
    /* ===== EDIT THESE ===== */
    const CONFIG = {
      guestGreeting: "Hii!",            // e.g. "Hii Mom!" for a personal touch
      name: "Thando",                    // your brother's name
      age: "18",                        // the number shown big
      photo: "images/image.png",
      day: "28",
      weekday: "Saturday",
      month: "November",
      time: "6:00pm",
      venueName: "Venue name",
      address: "Street address, Suburb",
      dressCode: "come as you are",
      rsvpNumber: "",                   // e.g. "27821234567" (no + or spaces) to show an RSVP button
      rsvpText: "I’ll be there!"
    };
    /* ====================== */
    const $ = id => document.getElementById(id);
    $("gHi").textContent = CONFIG.guestGreeting;
    const dg = String(CONFIG.age).split("");
    $("n1").textContent = dg[0] || ""; $("n8").textContent = dg[1] || "";
    $("blurb").innerHTML = "you’re invited to<b>" + CONFIG.name + "’s</b>dinner party";
    $("colL").innerHTML = "<b>" + CONFIG.weekday + "</b>" + CONFIG.day + " " + CONFIG.month + "<br>" + CONFIG.time;
    $("colR").innerHTML = "<b>" + CONFIG.venueName + "</b>" + CONFIG.address + "<br>dress: " + CONFIG.dressCode;
    if (CONFIG.photo) { const im = new Image(); im.src = CONFIG.photo; im.alt = CONFIG.name; $("hero").appendChild(im); }
    if (CONFIG.rsvpNumber) {
      const a = document.createElement("a"); a.className = "btn"; a.textContent = "RSVP on WhatsApp";
      a.href = "https://wa.me/" + CONFIG.rsvpNumber + "?text=" + encodeURIComponent(CONFIG.rsvpText);
      a.target = "_blank"; a.rel = "noopener"; $("cta").appendChild(a);
    }

    /* ransom-note title */
    const fonts = ['"Playfair Display",serif', 'Anton,Impact,sans-serif', '"Abril Fatface",serif', '"Special Elite",monospace', '"Archivo Black",sans-serif'];
    const bgs = ['var(--tile1)', 'var(--tile2)', 'var(--tile3)', '#111'];
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const words = ["HAPPY", "BIRTHDAY"];
    words.forEach((w, wi) => {
      const target = $(wi === 0 ? "ransom1" : "ransom2");
      [...w].forEach(c => {
        const br = document.createElement("span");
        const bg = bgs[Math.floor(rnd() * bgs.length)];
        br.textContent = rnd() > .5 ? c : c.toLowerCase();
        br.style.fontFamily = fonts[Math.floor(rnd() * fonts.length)];
        br.style.background = bg;
        br.style.color = bg === "#111" ? "#ece5d6" : "#000";
        br.style.transform = "rotate(" + ((rnd() * 8 - 4).toFixed(1)) + "deg) translateY(" + ((rnd() * 6 - 3).toFixed(1)) + "px)";
        br.style.fontSize = (27 + Math.floor(rnd() * 6)) + "px";
        target.appendChild(br);
      });
    });

    /* open invite + confetti */
    const cv = $("fx"), cx = cv.getContext("2d"); let parts = [], raf = 0;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    function size() { const d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0) }
    addEventListener("resize", size); size();
    const cols = ["#000", "#000", "#f6f3ec", "#b9b3a4", "#8f8a7d", "#e9e5da"];
    function burst(x, y, n, spread, power) {
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (Math.random() - .5) * spread, v = power * (.4 + Math.random() * .8);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 6 + Math.random() * 7, h: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[i % cols.length], life: 0, star: Math.random() < .2 });
      }
    }
    function tick() {
      cx.clearRect(0, 0, innerWidth, innerHeight);
      parts = parts.filter(p => p.y < innerHeight + 30 && p.life < 260);
      for (const p of parts) {
        p.life++; p.vy += .28; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.strokeStyle = "#000"; cx.lineWidth = .6;
        if (p.star) { cx.beginPath(); for (let k = 0; k < 10; k++) { const rr = k % 2 ? p.w * .25 : p.w * .7, t = k * Math.PI / 5; cx.lineTo(Math.sin(t) * rr, -Math.cos(t) * rr) } cx.closePath(); cx.fill() }
        else { cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h) }
        cx.restore();
      }
      raf = parts.length ? requestAnimationFrame(tick) : 0;
    }
    function fire() {
      if (reduce) return;
      const W = innerWidth, H = innerHeight;
      burst(W * .15, H * .85, 90, 1.1, 17); burst(W * .85, H * .85, 90, 1.1, 17); burst(W * .5, H * .6, 70, 2.2, 15);
      setTimeout(() => { burst(W * .3, H * .7, 50, 1.6, 14); burst(W * .7, H * .7, 50, 1.6, 14) }, 350);
      if (!raf) raf = requestAnimationFrame(tick);
    }
    $("open").addEventListener("click", () => {
      $("gate").style.display = "none";
      $("invite").classList.add("on");
      window.scrollTo(0, 0);
      fire();
    });
  </script>
</body>

</html>
